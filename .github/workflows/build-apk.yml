name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu images already carry the Android SDK with licences
      # accepted, so there is nothing to install — just make sure the pieces
      # this build needs are present.
      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        id: build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # The sandbox that drives this repo cannot download run logs, so a failure
      # is re-emitted as workflow annotations, which the API does expose.
      - name: Surface the failure
        if: failure()
        run: |
          echo "::group::tail of the build log"
          tail -n 120 /tmp/build.log || true
          echo "::endgroup::"
          # everything from the first FAILURE marker onwards, plus any compiler errors
          { sed -n '/^FAILURE:/,$p' /tmp/build.log
            grep -E '^(e: |.*\.java:[0-9]+: error:|.*\.xml:[0-9]+: )' /tmp/build.log
          } | grep -v '^$' | head -n 30 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/ /g')
              echo "::error::$clean"
            done

      - name: Name the file
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/PitchReady-1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PitchReady-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Publish a release so the APK downloads straight to a phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pitch Ready 1.0.${{ github.run_number }}
          body: |
            Pitch Ready for Android.

            Install: open this page on an Android phone, download the .apk,
            and allow installing from this source when asked.

            The coach signs in with the coach code; families use the family code.
          files: out/*.apk
