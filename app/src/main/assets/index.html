</style></head><body><div id="app"></div><script>
(()=>{'use strict';const KEY='pitchready-demo-v2';const roster=['Liam Carter','Noah Kim','Ethan Brooks','Mason Lee','Lucas Moreau','Oliver Grant','Aiden Reed','Leo Martin'];const strands={'Dribbling':['Close control','Change of direction','1v1 moves','Dribble at speed'],'Control':['First touch','Receive and turn','Ball mastery','Control under pressure'],'Passing':['Short passing','Pass accuracy','Moving pass','Pass under pressure'],'Shooting':['Instep shot','Finishing','Shots on the move','Weak-foot finishing']};const levels=['Not yet','Tried it','Getting it','Confident'];const sample=()=>({role:'parent',tab:'tonight',subtab:'overview',dateChecks:{},bedtime:'21:00',habits:{practice:true,play:true,water:true,breakfast:false},attendance:roster.map((_,i)=>i===4?'L':'P'),effort:roster.map((_,i)=>i===1?2:3),tags:roster.map(()=>[]),notes:[{date:'Oct 12',body:'Great movement off the ball today. Helped teammates and kept trying!',author:'Coach Alex'}],goal:'Improve first touch under pressure',skillLevels:{},savedNights:5});let data;try{data={...sample(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=sample()}let root=document.getElementById('app'),toastTimer;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Local storage unavailable',e)}},esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),notify=s=>{document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=s;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2300)};const header=(mode)=>`<header class="top"><div class="logo">PITCH<span>READY</span></div><button class="pill" data-role="1" aria-label="Switch between demo roles">⚽ ${mode==='parent'?'Parent':'Coach'} Mode ▾</button></header>`;const nav=(labels)=>`<nav class="bottom">${labels.map(([tab,icon,text])=>`<button class="${data.tab===tab?'active':''}" data-nav="${tab}"><span class="ic">${icon}</span>${text}</button>`).join('')}</nav>`;function tonight(){let count=Object.values(data.habits).filter(Boolean).length;let days=Math.max(data.savedNights, Object.keys(data.dateChecks).length),percent=Math.round(days/7*100);return `<div class="app light"><div class="hero parent">${header('parent')}<div class="hero-content"><div class="headline">Small habits.<br><em>Big game days.</em></div><div class="subtitle">Tonight's check-in (20 seconds)</div></div></div><main class="parent-content"><section class="card"><div class="cardhead"><h2>How did tonight go?</h2><span class="muted">${new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</span></div><div class="bedtime"><span class="moon">🌙</span><span class="lab">Bedtime <small class="muted" style="display:block;font-weight:400">What time did your child go to bed?</small></span><input aria-label="Bedtime" id="bedtime" type="time" value="${esc(data.bedtime)}"></div><div class="habits-grid">${[['practice','👟','Home practice'],['play','⚽','Free play'],['water','💧','Water'],['breakfast','🥣','Breakfast']].map(([id,icon,label])=>`<button aria-pressed="${!!data.habits[id]}" class="habit ${data.habits[id]?'on':''}" data-habit="${id}"><span class="ico">${icon}</span><span>${label}</span><span class="check">${data.habits[id]?'✓':'○'}</span></button>`).join('')}</div><button class="btn full" data-save-night="1">Save tonight ✓</button></section><section class="week"><div class="weektop"><div><h3>This week</h3><p>${days} of 7 nights completed</p></div><div class="ring" style="--progress:${Math.min(percent,100)}%">${percent}%</div></div><div class="days">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="day ${i<days?'done':''}"><i>${i<days?'✓':'·'}</i><small>${d}</small></div>`).join('')}</div></section><div class="reward"><span style="font-size:27px">🏆</span><div><strong>Great routine!</strong>Small, consistent habits build stronger players.</div></div></main>${nav([['tonight','⌂','Tonight'],['progress','▥','Progress'],['skills','⚽','Skills'],['messages','☏','Notes']])}</div>`}
function score(){return `<div class="metrics"><div class="metric"><div class="icon">🗓️</div><strong>92%</strong><small>Attendance</small><div class="track"><i style="width:92%"></i></div></div><div class="metric"><div class="icon">🌙</div><strong>9h 12m</strong><small>Avg. sleep</small><div class="track"><i style="width:80%;background:var(--blue)"></i></div></div><div class="metric"><div class="icon">📊</div><strong>+3</strong><small>Skill steps</small><div class="track"><i style="width:65%;background:var(--amber)"></i></div></div></div>`}function chart(){return `<div class="section"><h3>Sleep Trend <small style="font-size:12px;color:#26984e">↘ 38 min earlier than September</small></h3><div class="trend"><svg viewBox="0 0 340 118" role="img" aria-label="Illustrative sleep time chart for this month"><g stroke="#5d8c77" opacity=".28"><path d="M0 27H340M0 60H340M0 94H340"/></g><polyline points="4,32 38,39 76,45 114,50 152,53 190,56 228,58 266,66 304,68 338,72" fill="none" stroke="#ffffff77" stroke-width="2" stroke-dasharray="4 4"/><polyline points="4,61 38,66 76,72 114,74 152,74 190,73 228,78 266,72 304,74 338,83" fill="none" stroke="#88f879" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${[4,38,76,114,152,190,228,266,304,338].map((x,i)=>`<circle cx="${x}" cy="${[61,66,72,74,74,73,78,72,74,83][i]}" r="3.5" fill="#88f879"/>`).join('')}<text x="5" y="112" font-size="10" fill="#a6c5b2">September</text><text x="290" y="112" font-size="10" fill="#a6c5b2">October</text></svg></div></div>`}function overview(){return `<h2>Monthly Scoreboard</h2>${score()}${chart()}<section class="section"><h3>💬 Coach's latest note</h3><div class="note">${esc(data.notes[0]?.body||'No notes yet.')}<div class="muted">${esc(data.notes[0]?.date||'')} · Coach Alex</div></div></section><section class="section"><h3>🎯 This month's goal</h3><div class="note">${esc(data.goal)}</div><div class="goalprogress"><i></i></div><small class="muted">Demo progress indicator · not an evaluation</small></section>`}function habitsTab(){return `<h2>Habit consistency</h2><p class="muted">A visual overview of submitted daily habits, not a score for your child.</p><section class="section"><h3>October · Daily check-ins</h3><div class="heatmap">${Array.from({length:35},(_,i)=>`<i class="${['','v1','v2','v3','v2'][i%5]}"></i>`).join('')}</div></section><section class="section"><h3>What is going well</h3><p class="note">✅ Water and free play are the most consistent habits.</p><p class="note">🌙 Keep logging bedtime to spot meaningful patterns.</p></section>`}function skillsTab(){return `<h2>Football development</h2><p class="muted">Continuous observation · no pass/fail grades. Skills are grouped into four areas used in grassroots coaching.</p><section class="section"><h3>🎯 Current focus</h3><div class="note">First touch under pressure. At home: gentle passes against a wall, 10 minutes.</div></section>${Object.entries(strands).map(([group,items])=>`<section class="section"><h3>${group}</h3>${items.map(item=>`<div class="skillrow"><span>⚽ ${item}</span>${data.role==='coach'?`<select data-skill="${esc(item)}" aria-label="Skill level for ${esc(item)}">${levels.map((l,i)=>`<option value="${i}" ${Number(data.skillLevels[item]||0)===i?'selected':''}>${l}</option>`).join('')}</select>`:`<small>${levels[data.skillLevels[item]||0]}</small>`}</div>`).join('')}</section>`).join('')}`}function notesTab(){return `<h2>Coach notes</h2>${data.notes.map(n=>`<section class="section"><h3>${esc(n.date)} · ${esc(n.author)}</h3><p class="note">${esc(n.body)}</p></section>`).join('')}<p class="muted">Notes reflect observations from training, not automated judgments.</p>`}function recordTab(){return `<h2>Coach record</h2><section class="section"><h3>Add training note</h3><textarea class="text-input" rows="4" id="newnote" placeholder="What did you observe during today's practice?"></textarea><button class="btn full" data-add-note="1">Save coach note</button></section><section class="section"><h3>Monthly goal</h3><input class="text-input" id="newgoal" value="${esc(data.goal)}" aria-label="Monthly goal"><button class="btn full" data-save-goal="1">Save goal</button></section><p class="muted">Update individual skill levels under Skills.</p>`}function player(){let sub=data.subtab==='record'&&data.role!=='coach'?'overview':data.subtab;let available=['overview','habits','skills','notes',...(data.role==='coach'?['record']:[])];return `<div class="app"><div class="hero player profile-hero">${header(data.role)}<div class="hero-content" style="bottom:35px"><div class="profile-name">Liam Carter</div><div class="profile-info">U11 · Midfielder · #10</div><div class="profile-quote">“Works hard and always helps teammates.”</div></div></div><main class="profile-body"><div class="seg">${available.map(t=>`<button data-subtab="${t}" class="${sub===t?'active':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div class="paper">${({overview,habits:habitsTab,skills:skillsTab,notes:notesTab,record:recordTab}[sub]||overview)()}</div></main>${nav(data.role==='parent'?[['tonight','⌂','Tonight'],['progress','▥','Progress'],['skills','⚽','Skills'],['messages','☏','Notes']]:[['today','▣','Today'],['players','♙','Players'],['progress','▥','Progress'],['messages','☏','Notes']])}</div>`}function coach(){return `<div class="app"><div class="hero coach" style="min-height:345px">${header('coach')}<div class="hero-content" style="bottom:45px"><div class="headline" style="font-size:34px">U11 Thunderbolts</div><div class="subtitle">Today · Practice session · 5:30 PM</div></div></div><main class="coach-body"><div class="seg">${[['today','Today'],['players','Players'],['progress','Progress'],['messages','Notes']].map(([t,n])=>`<button data-nav="${t}" class="${data.tab===t?'active':''}">${n}</button>`).join('')}</div><h2 class="coach-title">Attendance &amp; Effort</h2><p class="tabinfo">Tap attendance, select effort, and add positive observations.</p><div class="roster">${roster.map((name,i)=>`<div class="playerrow"><div class="line1"><div class="avatar">${name.split(' ').map(s=>s[0]).join('')}</div><div class="name">${esc(name)}<small>#${[10,7,9,4,11,6,16,18][i]}</small></div><div class="att">${['P','L','A'].map(a=>`<button data-att="${i},${a}" class="${data.attendance[i]===a?'selected '+a:''}" aria-label="${a==='P'?'Present':a==='L'?'Late':'Absent'} ${esc(name)}">${a}</button>`).join('')}</div></div><div class="line2"><div class="effort">Effort ${[1,2,3].map(n=>`<button data-effort="${i},${n}" class="${data.effort[i]===n?'selected':''}">${n}</button>`).join('')}</div>${[['listen','👂'],['team','🤝'],['grit','⭐']].map(([tag,emoji])=>`<button class="tag ${data.tags[i].includes(tag)?'active':''}" data-tag="${i},${tag}" aria-label="${tag} positive observation for ${esc(name)}">${emoji}</button>`).join('')}</div></div>`).join('')}<button class="btn full" data-save-coach="1">Save attendance &amp; notes ✓</button></div></main>${nav([['today','▣','Today'],['players','♙','Players'],['progress','▥','Progress'],['messages','☏','Notes']])}</div>`}function render(){const coachHome=data.role==='coach'&&data.tab==='today';const parentHome=data.role==='parent'&&data.tab==='tonight';root.innerHTML=coachHome?coach():parentHome?tonight():player();document.querySelector('meta[name="theme-color"]').content='#07110f'}root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.role){data.role=data.role==='parent'?'coach':'parent';data.tab=data.role==='coach'?'today':'tonight';data.subtab='overview'}else if(b.dataset.nav){data.tab=b.dataset.nav;if(data.tab==='players'||data.tab==='progress')data.subtab='overview';if(data.tab==='skills')data.subtab='skills';if(data.tab==='messages')data.subtab='notes'}else if(b.dataset.subtab){data.subtab=b.dataset.subtab}else if(b.dataset.habit){data.habits[b.dataset.habit]=!data.habits[b.dataset.habit]}else if(b.dataset.att){let [i,a]=b.dataset.att.split(',');data.attendance[+i]=a}else if(b.dataset.effort){let [i,n]=b.dataset.effort.split(',');data.effort[+i]=+n}else if(b.dataset.tag){let [i,t]=b.dataset.tag.split(',');i=+i;data.tags[i]=data.tags[i].includes(t)?data.tags[i].filter(x=>x!==t):[...data.tags[i],t]}else if(b.dataset.saveNight){data.dateChecks[new Date().toLocaleDateString('en-CA')]=true;data.savedNights=Math.max(data.savedNights,6);notify('Tonight saved on this device ✓')}else if(b.dataset.saveCoach){notify('Coach attendance saved locally ✓')}else if(b.dataset.addNote){let v=document.getElementById('newnote')?.value.trim();if(v){data.notes.unshift({date:new Date().toLocaleDateString('en-CA',{month:'short',day:'numeric'}),body:v,author:'Coach Alex'});notify('Note saved ✓')}else notify('Write a note before saving')}else if(b.dataset.saveGoal){data.goal=document.getElementById('newgoal').value;notify('Goal saved ✓')}save();render()});root.addEventListener('change',e=>{if(e.target.id==='bedtime')data.bedtime=e.target.value;if(e.target.dataset.skill)data.skillLevels[e.target.dataset.skill]=Number(e.target.value);save();render()});render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});})();

</script></body></html>
