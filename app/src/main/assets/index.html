<title>Pitch Ready</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ================================================================
     Pitch Ready — design system v1.0 (approved)
     Premium sports / football academy / modern mobile SaaS.
     Parent + Player read light and warm; Coach is deep-black dark mode.
     Electric Lime is the single action colour; Blue, Amber and Alert are
     semantic only (sleep, caution, absence).
     ================================================================ */
  :root {
    /* brand — fixed, never re-themed by a club kit */
    --lime: #88F879;
    --lime-hi: #A0FF8D;
    --lime-ink: #07110F;          /* 14:1 on lime */
    --pitch: #093D2D;
    --black: #07110F;
    --surface: #1C2925;
    --blue: #378BFF;
    --amber: #FFB637;
    --alert: #FF654B;

    --lime-wash: rgba(136, 248, 121, .15);
    --blue-wash: rgba(55, 139, 255, .13);
    --amber-wash: rgba(255, 182, 55, .17);
    --alert-wash: rgba(255, 101, 75, .13);

    /* surfaces — light */
    --bg: #FCFBF8;
    --card: #FFFFFF;
    --ink: #141A18;
    --dim: #89948F;
    --line: rgba(20, 26, 24, .10);
    --soft: rgba(20, 26, 24, .045);
    --grid: rgba(20, 26, 24, .09);
    --sh: 0 1px 2px rgba(7, 17, 15, .04), 0 14px 34px -22px rgba(7, 17, 15, .45);

    /* the habit ramp: warm white up to pitch green */
    --c1: #EEF2EF; --c2: #CFEBC8; --c3: #A7E39A; --c4: #4FBF63; --c5: #15713F;
    --c4-ink: #141A18; --c5-ink: #FFFFFF;

    --tint-lime: #0B5A3C; --tint-amber: #8A5A00; --tint-blue: #1C5FB8; --tint-alert: #A8321E;

    --disp: "Barlow Condensed", "Arial Narrow", sans-serif;
    --ui: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --r: 20px;
  }

  /* Coach is dark by design, not by preference. Parent and Player follow the
     phone at night, because the check-in happens at bedtime. */
  :root[data-mode="coach"],
  :root[data-mode="coach"] * { color-scheme: dark; }
  :root[data-mode="coach"] {
    --bg: #07110F; --card: #1C2925; --ink: #FFFFFF; --dim: #89948F;
    --line: rgba(255, 255, 255, .11); --soft: rgba(255, 255, 255, .055);
    --grid: rgba(255, 255, 255, .10);
    --sh: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px -22px rgba(0, 0, 0, .9);
    --c1: #16231E; --c2: #1D3A2A; --c3: #2B6440; --c4: #4FBF63; --c5: #88F879;
    --c4-ink: #07110F; --c5-ink: #07110F;
    --tint-lime: #88F879; --tint-amber: #FFB637; --tint-blue: #6FB0FF; --tint-alert: #FF8E78;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #07110F; --card: #1C2925; --ink: #FFFFFF; --dim: #89948F;
      --line: rgba(255, 255, 255, .11); --soft: rgba(255, 255, 255, .055);
      --grid: rgba(255, 255, 255, .10);
      --sh: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px -22px rgba(0, 0, 0, .9);
      --c1: #16231E; --c2: #1D3A2A; --c3: #2B6440; --c4: #4FBF63; --c5: #88F879;
      --c4-ink: #07110F; --c5-ink: #07110F;
      --tint-lime: #88F879; --tint-amber: #FFB637; --tint-blue: #6FB0FF; --tint-alert: #FF8E78;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  h1, h2, h3 { font-family: var(--disp); font-weight: 700; margin: 0; letter-spacing: -.005em; }
  h2 { font-size: 24px; line-height: 1.08; }
  h3 { font-size: 21px; line-height: 1.12; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; border-radius: 8px; }
  [hidden] { display: none !important; }

  /* ---------- shell ---------- */
  .wrap {
    max-width: 520px; margin: 0 auto;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }
  main { padding-bottom: 98px; }
  main .wrap { padding-block: 0 12px; display: flex; flex-direction: column; gap: 14px; }
  /* heroes bleed past the gutter */
  .bleed {
    margin-left: calc(-1 * max(18px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(18px, env(safe-area-inset-right, 0px)));
  }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--black); border-top: 1px solid rgba(255, 255, 255, .08);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs .wrap { display: flex; padding-block: 8px 6px; gap: 2px; }
  nav.tabs button {
    flex: 1; min-width: 0; background: none; border: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 5px 2px; color: #89948F; font-size: 11px; font-weight: 600; border-radius: 12px;
  }
  nav.tabs button[aria-current="true"] { color: var(--lime); }
  nav.tabs svg { width: 21px; height: 21px; }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff; background: var(--black);
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px 24px;
  }
  /* the default backdrop: a floodlit pitch at night — mown stripes, a bloom
     from the lights, the mesh of the goal behind it */
  .hero::before, .pghead::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 26px, rgba(255,255,255,0) 26px 52px),
      radial-gradient(60% 46% at 80% -6%, rgba(224,255,214,.30), rgba(224,255,214,0) 70%),
      radial-gradient(120% 95% at 78% -12%, rgba(136,248,121,.22), rgba(136,248,121,0) 60%),
      radial-gradient(95% 72% at 6% 112%, rgba(9,61,45,.95), rgba(9,61,45,0) 64%),
      linear-gradient(168deg, #10301F 0%, #07110F 74%);
  }
  .hero::after, .pghead::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.055) 0 1px, transparent 1px 13px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.055) 0 1px, transparent 1px 13px);
    -webkit-mask-image: radial-gradient(62% 72% at 86% 8%, #000 10%, transparent 72%);
    mask-image: radial-gradient(62% 72% at 86% 8%, #000 10%, transparent 72%);
  }
  /* a real photo, when the academy has supplied one */
  .hero > .cover, .pghead > .cover {
    position: absolute; inset: 0; z-index: 1; background-size: cover;
    background-position: center 28%; pointer-events: none;
  }
  /* Two layers, so the photo still reads top-right while the type sits on
     something dark enough to clear AA over even a white photo. */
  .hero > .scrim, .pghead > .scrim {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(135% 105% at 112% -12%, rgba(7,17,15,.08), rgba(7,17,15,.74) 64%),
      linear-gradient(180deg, rgba(7,17,15,.56) 0%, rgba(7,17,15,.68) 40%, rgba(7,17,15,.95) 100%);
  }
  .hero > *, .pghead > * { position: relative; z-index: 3; }
  .hero .ball {
    position: absolute; right: -58px; top: -34px; width: 230px; height: 230px;
    color: rgba(255, 255, 255, .075); z-index: 1; pointer-events: none;
  }
  .hero.haspic::after, .pghead.haspic::after { opacity: .35; }
  .hero .toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hero h1 {
    font-weight: 800; font-size: clamp(34px, 10.4vw, 46px); line-height: .93;
    letter-spacing: -.015em; margin: 24px 0 0; max-width: 11ch;
  }
  .hero h1 em { font-style: normal; color: var(--lime); display: block; }
  .hero .kicker { margin: 13px 0 0; font-size: 13.5px; line-height: 1.45; color: rgba(255, 255, 255, .70); max-width: 28ch; }

  .logo { display: flex; align-items: center; gap: 9px; }
  .logo .sw { width: 30px; height: 30px; flex: none; color: var(--lime); }
  .logo .mk {
    font-family: var(--disp); font-style: italic; font-weight: 800; text-transform: uppercase;
    font-size: 20px; line-height: .86; letter-spacing: .005em;
  }
  .logo .mk i { display: block; font-style: italic; color: var(--lime); }

  .modepill {
    display: inline-flex; align-items: center; gap: 7px; flex: none;
    background: rgba(7, 17, 15, .58); border: 1px solid rgba(255, 255, 255, .22);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  }
  .modepill svg { width: 15px; height: 15px; color: var(--lime); }

  /* ---------- cards ---------- */
  .card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--sh); }
  :root[data-mode="coach"] .card { box-shadow: none; border: 1px solid var(--line); }
  .card > .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .eyebrow {
    font-family: var(--disp); font-size: 13px; font-weight: 700; letter-spacing: .11em;
    text-transform: uppercase; color: var(--dim);
  }
  .muted { color: var(--dim); }
  .small { font-size: 13.5px; }
  .tiny { font-size: 12px; }
  .stack { display: flex; flex-direction: column; gap: 13px; }
  .row { display: flex; align-items: center; gap: 11px; }
  .grow { flex: 1; min-width: 0; }

  /* ---------- controls ---------- */
  .btn {
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 14px; padding: 13px 18px; font-weight: 600; font-size: 15px; line-height: 1.2;
  }
  .btn.primary { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); font-weight: 700; }
  .btn.primary:hover { background: var(--lime-hi); border-color: var(--lime-hi); }
  .btn.pitch { background: var(--pitch); border-color: var(--pitch); color: #fff; }
  .btn.block { width: 100%; display: block; }
  .btn.big { padding: 16px 20px; font-size: 16px; border-radius: 16px; }
  .btn.ghost { background: none; }
  .btn:disabled { opacity: .5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 9px 15px; font-weight: 600; font-size: 14px;
  }
  .chip[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .tag {
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600;
    color: var(--dim); background: transparent;
  }
  .tag.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .tag.cone { background: var(--lime-wash); border-color: transparent; color: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--dim); }
  .field input, .field select, .field textarea {
    border: 1.5px solid var(--line); background: var(--soft); border-radius: 13px;
    padding: 12px 14px; font-size: 16px; width: 100%; font-family: var(--ui); color: var(--ink);
  }
  .field textarea { min-height: 86px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---------- parent: bedtime + habit cards ---------- */
  .bedrow { display: flex; align-items: center; gap: 12px; }
  .bedrow .ic {
    width: 40px; height: 40px; border-radius: 13px; flex: none;
    background: var(--blue-wash); color: var(--blue); display: grid; place-items: center;
  }
  .bedrow .ic svg { width: 21px; height: 21px; }
  .bedrow .lb b { display: block; font-size: 15px; font-weight: 600; }
  .bedrow .lb span { display: block; font-size: 12px; color: var(--dim); line-height: 1.3; }
  .bedsel {
    appearance: none; -webkit-appearance: none; flex: none;
    background: var(--soft); border: 1.5px solid var(--line); border-radius: 13px;
    padding: 11px 30px 11px 13px; font-size: 15px; font-weight: 700; width: auto; max-width: 40%;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }

  .habits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
  .hcard {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 12px 6px 11px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center; min-width: 0;
  }
  .hcard .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; }
  .hcard .ic svg { width: 19px; height: 19px; }
  .hcard .nm {
    font-size: 11px; font-weight: 600; line-height: 1.22; color: var(--ink);
    flex: 1; min-height: 28px; display: flex; align-items: center; justify-content: center;
  }
  .hcard .tick {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
    display: grid; place-items: center; flex: none;
  }
  .hcard .tick svg { width: 12px; height: 12px; opacity: 0; }
  .hcard[aria-pressed="true"] { border-color: var(--lime); background: var(--lime-wash); }
  .hcard[aria-pressed="true"] .tick { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .hcard[aria-pressed="true"] .tick svg { opacity: 1; }

  /* week card, in pitch green */
  .weekcard { background: var(--pitch); color: #fff; border-radius: var(--r); padding: 18px; }
  .weekcard .top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .weekcard h3 { color: #fff; font-size: 22px; }
  .weekcard .sub { font-size: 13px; color: rgba(255, 255, 255, .68); margin-top: 3px; }
  .ring { width: 68px; height: 68px; flex: none; }
  .ring text { font-family: var(--disp); font-weight: 800; font-size: 14px; fill: #fff; }
  .week { display: flex; gap: 6px; justify-content: space-between; margin-top: 15px; }
  .day { flex: 1; text-align: center; min-width: 0; }
  .day .dot {
    width: 100%; aspect-ratio: 1; max-width: 34px; margin: 0 auto 5px; border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .22); display: grid; place-items: center;
    font-family: var(--disp); font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, .55);
  }
  .day.done .dot { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .day.today .dot { box-shadow: 0 0 0 2px var(--pitch), 0 0 0 3.5px var(--lime); }
  .day .lb { font-size: 10.5px; font-weight: 600; color: rgba(255, 255, 255, .6); }

  .nudge {
    background: var(--amber-wash); border: 1px solid rgba(255, 182, 55, .4);
    border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center;
  }
  .nudge .ic { width: 34px; height: 34px; border-radius: 11px; background: var(--amber); color: var(--lime-ink); display: grid; place-items: center; flex: none; }
  .nudge .ic svg { width: 19px; height: 19px; }
  .nudge b { display: block; font-size: 15px; font-weight: 700; }
  .nudge span { display: block; font-size: 12.5px; color: var(--dim); }

  /* ---------- player profile ---------- */
  .pghead {
    position: relative; overflow: hidden; color: #fff; background: var(--black);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 0;
  }
  .pghead .navrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 12px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(7,17,15,.58); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; display: grid; place-items: center; padding: 0; flex: none;
  }
  .iconbtn svg { width: 17px; height: 17px; }
  .pgid { display: flex; align-items: flex-end; gap: 14px; margin-top: 16px; }
  .pgid .av { box-shadow: 0 0 0 3px rgba(255, 255, 255, .35); }
  .pghead .nm { font-family: var(--disp); font-style: italic; font-weight: 800; font-size: 32px; line-height: .95; }
  .pghead .meta { font-size: 13px; color: rgba(255, 255, 255, .74); margin-top: 4px; }
  .pghead .quote { font-size: 13.5px; font-style: italic; line-height: 1.45; color: rgba(255, 255, 255, .9); margin: 13px 0 0; }
  .pghead .byline { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: rgba(255, 255, 255, .68); }

  /* the five panels, as an icon strip on the dark header */
  .subnav {
    display: flex; gap: 5px; position: sticky; top: 0; z-index: 20; background: var(--black);
    /* bleeds to the gutter exactly, rather than past the viewport */
    margin-left: calc(-1 * max(18px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(18px, env(safe-area-inset-right, 0px)));
    padding: 15px max(18px, env(safe-area-inset-right, 0px)) 16px max(18px, env(safe-area-inset-left, 0px));
  }
  .subnav button {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 2px 8px; border-radius: 14px; border: 0;
    background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .72);
    font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden;
  }
  .subnav button[aria-current="true"] { background: var(--lime); color: var(--lime-ink); }
  .subnav svg { width: 18px; height: 18px; }

  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--soft); border-radius: 16px; padding: 12px 11px 13px; min-width: 0; }
  .kpi .chip2 { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 10px; }
  .kpi .chip2 svg { width: 17px; height: 17px; }
  .kpi .v { font-family: var(--disp); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -.01em; }
  .kpi .v small { font-size: 15px; font-weight: 700; }
  .kpi .k { font-size: 10.5px; color: var(--dim); font-weight: 600; margin-top: 3px; line-height: 1.25; }
  .kpi .meter { height: 5px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .kpi .meter i { display: block; height: 100%; border-radius: 3px; }

  .linkrow {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border: 0; border-radius: 18px; padding: 15px 16px; box-shadow: var(--sh);
  }
  :root[data-mode="coach"] .linkrow { box-shadow: none; border: 1px solid var(--line); }
  .linkrow .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; }
  .linkrow .ic svg { width: 18px; height: 18px; }
  .linkrow .bd { flex: 1; min-width: 0; }
  .linkrow .bd b { display: block; font-size: 14.5px; font-weight: 700; }
  .linkrow .bd p { margin: 3px 0 0; font-size: 13px; color: var(--dim); line-height: 1.4; }
  .linkrow .chev { width: 16px; height: 16px; color: var(--dim); flex: none; }

  .delta {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--disp); font-size: 19px; font-weight: 800; color: var(--c5);
  }
  .delta.flat { color: var(--dim); }
  .delta.warn { color: var(--amber); }
  :root[data-mode="coach"] .delta { color: var(--lime); }

  /* ---------- coach ---------- */
  .teamhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
  .teamhead .nm { font-family: var(--disp); font-weight: 800; font-size: 29px; line-height: 1; display: flex; align-items: center; gap: 7px; }
  .teamhead .nm svg { width: 17px; height: 17px; opacity: .7; }
  .teamhead .sub { font-size: 13px; color: rgba(255, 255, 255, .7); margin-top: 4px; }
  .teamhead .sub b { color: var(--lime); font-weight: 600; }

  .pilltabs { display: flex; gap: 6px; padding: 16px 0 4px; }
  .pilltabs button {
    flex: 1 1 0; min-width: 0; border: 0; border-radius: 13px; padding: 11px 6px;
    background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .74);
    font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden;
  }
  .pilltabs button[aria-current="true"] { background: var(--lime); color: var(--lime-ink); font-weight: 700; }

  .crow { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 13px 14px; }
  .crow .line1 { display: flex; align-items: center; gap: 11px; }
  .crow .who { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; font: inherit; }
  .crow .who b { display: block; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .who span { display: block; font-size: 12px; color: var(--dim); }
  .crow .right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
  .effwrap { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .off { opacity: .32; pointer-events: none; }
  .efflb { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }

  .att { display: flex; gap: 4px; }
  .att button {
    width: 32px; height: 31px; border-radius: 9px; border: 1.5px solid var(--line);
    background: transparent; color: var(--ink); font-family: var(--disp);
    font-weight: 700; font-size: 14px; padding: 0;
  }
  .att button[aria-pressed="true"][data-v="P"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .att button[aria-pressed="true"][data-v="L"] { background: var(--amber); border-color: var(--amber); color: var(--lime-ink); }
  .att button[aria-pressed="true"][data-v="A"] { background: var(--alert); border-color: var(--alert); color: var(--lime-ink); }

  .pips { display: flex; gap: 4px; }
  .pips button {
    width: 28px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line);
    background: transparent; color: var(--dim); font-family: var(--disp);
    font-weight: 700; font-size: 13px; padding: 0;
  }
  .pips button[aria-pressed="true"] { color: var(--lime-ink); }
  .pips button[aria-pressed="true"][data-n="1"] { background: var(--alert); border-color: var(--alert); }
  .pips button[aria-pressed="true"][data-n="2"] { background: var(--amber); border-color: var(--amber); }
  .pips button[aria-pressed="true"][data-n="3"] { background: var(--lime); border-color: var(--lime); }

  .obs { display: flex; gap: 8px; margin-top: 11px; }
  .obs button {
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line);
    background: transparent; color: var(--dim); display: grid; place-items: center; padding: 0;
  }
  .obs button svg { width: 15px; height: 15px; }
  .obs button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }

  /* ---------- avatars & squad ---------- */
  .av { flex: none; border-radius: 50%; overflow: hidden; display: block; background: var(--pitch); position: relative; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av svg { width: 100%; height: 100%; display: block; }

  .squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 10px; }
  .pcard {
    border: 1.5px solid var(--line); border-radius: 18px; background: var(--card); padding: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  }
  .pcard .av { width: 56px; height: 56px; }
  .pcard b { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .pcard small { font-size: 12px; color: var(--dim); }

  .kits { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 9px; }
  .kitbtn {
    border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 9px 5px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .kitbtn[aria-pressed="true"] { border-color: var(--lime); }
  .kitbtn svg { width: 34px; height: 34px; }
  .kitbtn span { font-size: 11px; font-weight: 600; color: var(--dim); line-height: 1.15; }
  .kitbtn .acc { width: 22px; height: 4px; border-radius: 2px; display: block; }
  .photorow { display: flex; align-items: center; gap: 12px; }
  .photorow input[type="file"] { font-size: 13px; max-width: 100%; }

  /* ---------- skills ---------- */
  .sklist { display: flex; flex-direction: column; }
  .skrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .skrow:last-child { border-bottom: 0; }
  .skrow .crestbg { width: 22px; max-width: 22px; margin: 0; flex: none; }
  .skrow .nm { flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; color: var(--dim); }
  .skrow.on .nm { color: var(--ink); font-weight: 600; }
  .skrow .lv { font-size: 11px; font-weight: 700; color: var(--dim); flex: none; white-space: nowrap; }
  .skrow.on .lv { color: var(--c5); }
  :root[data-mode="coach"] .skrow.on .lv { color: var(--lime); }
  .bandhd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 12px 0 0; }
  .lvkey { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .lvkey > span { display: inline-flex; align-items: center; gap: 5px; }
  .lvkey .crestbg { width: 15px; max-width: 15px; margin: 0; }
  .lvkey i { font-style: normal; font-size: 11px; color: var(--dim); font-weight: 600; }
  .crestbg { width: 100%; max-width: 58px; aspect-ratio: 1 / 1.14; margin: 0 auto 5px; display: block; }
  .bandbar { display: flex; align-items: center; gap: 8px; }
  .bandbar .seg { flex: 1; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bandbar .seg i { display: block; height: 100%; }

  /* ---------- charts ---------- */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .chart .axis { font-size: 10.5px; fill: var(--dim); font-variant-numeric: tabular-nums; }
  .chart .vlabel { font-size: 12px; font-weight: 700; fill: var(--ink); }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; min-width: 96px;
    background: var(--black); color: #fff; border-radius: 12px; padding: 8px 11px;
    font-size: 12px; line-height: 1.35; box-shadow: 0 8px 24px -10px rgba(0,0,0,.7);
    opacity: 0; transition: opacity .1s;
  }
  .tip b { font-size: 14px; font-weight: 700; display: block; }
  .chart-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .chart-hd .lede { font-size: 13px; color: var(--dim); margin-top: 6px; max-width: 44ch; line-height: 1.45; }
  .tbtn {
    border: 1.5px solid var(--line); background: transparent; border-radius: 10px; padding: 6px 11px;
    font-size: 12px; font-weight: 600; color: var(--dim); flex: none;

  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; align-items: center; }
  .bar .nm { font-size: 14px; font-weight: 500; }
  .bar .vl { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--dim); }
  .bar .track { grid-column: 1 / -1; height: 9px; border-radius: 5px; background: var(--line); overflow: hidden; }

  .legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }

  .cal button {
    aspect-ratio: 1; border: 0; border-radius: 8px; background: var(--c1); padding: 0;
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; font-weight: 600;
  }

  .cal button.lv4 { color: var(--c5-ink); }
  .cal button.out { background: none; color: transparent; }

  .note { border-left: 3px solid var(--lime); background: var(--lime-wash); border-radius: 0 14px 14px 0; padding: 12px 14px; }
  .note p { margin: 0; font-size: 14.5px; line-height: 1.5; }

  .notelist { display: flex; flex-direction: column; gap: 10px; }

  .banner { border-radius: 16px; padding: 14px 16px; font-size: 14px; display: flex; gap: 11px; align-items: flex-start; }
  .banner.good { background: var(--lime-wash); color: var(--ink); border: 1px solid rgba(136, 248, 121, .5); }
  .banner.warn { background: var(--alert-wash); color: var(--ink); border: 1px solid rgba(255, 101, 75, .45); }
  .banner svg { width: 19px; height: 19px; flex: none; margin-top: 1px; }
  .banner.good svg { color: var(--c5); }
  :root[data-mode="coach"] .banner.good svg { color: var(--lime); }
  .banner.warn svg { color: var(--alert); }
  .banner b { font-weight: 700; }

  .empty { text-align: center; padding: 28px 16px; }
  .empty .ball { width: 52px; height: 52px; margin: 0 auto 13px; display: block; color: var(--line); }
  .empty p { margin: 8px 0 0; color: var(--dim); font-size: 14.5px; }

  .saved { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 700; font-size: 14px; }
  .saved svg { width: 18px; height: 18px; color: var(--c5); }
  :root[data-mode="coach"] .saved svg { color: var(--lime); }

  .slab { background: var(--pitch); color: #fff; border-radius: var(--r); padding: 17px 18px; }
  .slab .ttl { font-family: var(--disp); font-size: 24px; font-weight: 800; line-height: 1.05; }
  .slab .sub { font-size: 13px; color: rgba(255, 255, 255, .7); margin-top: 4px; }
  .slabgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; margin-top: 15px; background: rgba(255,255,255,.15); border-radius: 13px; overflow: hidden; }
  .slabgrid > div { background: var(--pitch); padding: 12px 13px; }
  .slabgrid .v { font-family: var(--disp); font-size: 26px; font-weight: 800; line-height: 1.05; }
  .slabgrid .k { font-size: 12px; color: rgba(255, 255, 255, .68); margin-top: 2px; }

  .ai { border: 1.5px dashed var(--line); border-radius: 18px; padding: 16px; background: transparent; }
  .ai .out { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; margin-top: 10px; }
  .ai .out:empty { display: none; }

  @media (prefers-reduced-motion: no-preference) {
    .pop { animation: pop .34s cubic-bezier(.2, .9, .3, 1.3); }
    @keyframes pop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  }
</style>

<script>
(function () {
  "use strict";

  /* ================= content (app data, not viewer records) ================= */

  // Stages follow Canada Soccer's grassroots age bands; the four strands below
  // (dribbling, control, passing, striking) are the technique areas their
  // Coach's Tool Kit names. Arranging them as a per-stage progression is ours.
  const BANDS = [

  async function rpc(fn, args) {
    let res;
    try {
      res = await fetch(SUPA.url + "/rest/v1/rpc/" + fn, {
        method: "POST",
        headers: { "apikey": SUPA.key, "Authorization": "Bearer " + SUPA.key, "Content-Type": "application/json" },
        body: JSON.stringify(args || {})

    } catch (e) {
      throw new Error("offline");
    }
    const text = await res.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
    if (!res.ok) {
      const code = (body && (body.message || body.hint)) || ("http_" + res.status);
      throw new Error(/unknown_code/.test(code) ? "unknown_code"

                    : /player_not_in_academy/.test(code) ? "wrong_player" : code);

    return body;

  function ring(pct) {
    const s = sv("svg", { class: "ring", viewBox: "0 0 44 44", "aria-hidden": "true" });
    const C = 2 * Math.PI * 19;
    s.appendChild(sv("circle", { cx: 22, cy: 22, r: 19, fill: "none", stroke: "rgba(255,255,255,.2)", "stroke-width": "4" }));
    s.appendChild(sv("circle", {
      cx: 22, cy: 22, r: 19, fill: "none", stroke: "#88F879", "stroke-width": "4", "stroke-linecap": "round",
      "stroke-dasharray": C, "stroke-dashoffset": C * (1 - Math.max(0, Math.min(1, pct / 100))),
      transform: "rotate(-90 22 22)"
    }));
    const t = sv("text", { x: 22, y: 22, "text-anchor": "middle", "dominant-baseline": "central" });
    t.textContent = pct + "%";
    s.appendChild(t);

  async function weekStrip(p) {
    const today = new Date();
    const mon = mondayOf(today);
    const months = {};
    const card = el("div", { class: "weekcard", "data-week": "1" });
    const days = [];
    for (let i = 0; i < 7; i++) days.push(addDays(mon, i));
    for (const d of days) {
      const mk = monthKey(d);
      if (!(mk in months)) months[mk] = await monthData(p.id, mk);
    }
    let done = 0;
    const strip = el("div", { class: "week" });
    days.forEach(function (d, i) {
      const doc = months[monthKey(d)];
      const rec = doc && doc.days ? doc.days[dayKey(d)] : null;
      const isDone = !!rec;
      if (isDone) done++;
      const isToday = ymd(d) === ymd(today);
      const cell = el("div", { class: "day" + (isDone ? " done" : "") + (isToday ? " today" : "") });
      const dot = el("div", { class: "dot num", text: String(d.getDate()) });
      if (isDone) { dot.textContent = ""; dot.appendChild(icon("i-check")); dot.querySelector("svg").style.cssText = "width:16px;height:16px"; }
      cell.appendChild(dot);
      cell.appendChild(el("div", { class: "lb", text: DOW[i].slice(0, 1) }));
      strip.appendChild(cell);
    });
    card.appendChild(el("div", { class: "top" }, [
      el("div", { class: "grow" }, [
        el("h3", { text: "This week" }),
        el("div", { class: "sub", text: done + " of 7 nights completed" })
      ]),
      ring(Math.round((done / 7) * 100))
    ]));
    card.appendChild(strip);
    return card;
  }

  /* ---------- player page ----------
     One scoreboard at the top answers "how is this month going?".
     Everything else lives behind the sub-nav, so nothing is a long scroll. */

  async function renderPlayer() {
    const p = myPlayer();
    if (!p) return view.appendChild(playerPicker());

    const mk = S.reportMonth;
    const heroHost = el("div");
    const navHost = el("div");
    const host = el("div", { class: "stack" });
    view.appendChild(heroHost);
    view.appendChild(navHost);
    view.appendChild(host);
    host.appendChild(el("div", { class: "card muted small", text: "Reading " + MONTHS[Number(mk.slice(5)) - 1] + "…" }));

    const yy = Number(mk.slice(0, 4)), mm = Number(mk.slice(5));
    const prevK = monthKey(new Date(yy, mm - 2, 1));
    const [cur, prev] = await Promise.all([monthData(p.id, mk), monthData(p.id, prevK)]);

    const days = cur.days;
    const sdays = cur.sdays;
    const sessionList = Object.keys(sdays).map(function (k) { return sdays[k]; });
    const earned = cur.earned;
    const prevDays = prev.days;
    const nt = { items: cur.items };

    const M = {
      p: p, mk: mk, days: days, sdays: sdays, sessionList: sessionList, earned: earned,
      inMonth: daysInMonth(mk),
      present: sessionList.filter(function (s) { return s.att === "P" || s.att === "L"; }).length,
      items: ((nt && nt.items) || []).slice().reverse(),
      earnedThisMonth: Object.keys(earned).filter(function (id) { return lvlDate(earned, id).slice(0, 7) === mk; }),
      points: Object.keys(days).sort().filter(function (k) { return typeof days[k].bed === "number"; })
        .map(function (k) { return { day: Number(k), bed: days[k].bed }; }),
      prevName: MON3[(mm + 10) % 12]
    };
    M.avgBed = avgOf(M.points.map(function (pt) { return pt.bed; }));
    M.prevAvg = avgOf(Object.keys(prevDays).map(function (k) { return prevDays[k].bed; }));

    const PANELS = [
      { id: "overview", label: "Overview", ic: "i-chart",  build: overviewPanel },
      { id: "habits",   label: "Habits",   ic: "i-cal",    build: habitsPanel },
      { id: "skills",   label: "Skills",   ic: "i-ball",   build: skillsPanel },
      { id: "notes",    label: "Notes",    ic: "i-chat",   build: notesPanel }
    ];
    if (S.role === "coach") PANELS.push({ id: "record", label: "Record", ic: "i-whistle", build: recordPanel });
    if (!PANELS.some(function (x) { return x.id === S.sub; })) S.sub = "overview";

    heroHost.textContent = "";
    heroHost.appendChild(playerHero(M));

    const nav = el("div", { class: "subnav" });
    navHost.textContent = "";
    navHost.appendChild(nav);
    PANELS.forEach(function (pn) {
      nav.appendChild(el("button", {
        type: "button", "aria-current": S.sub === pn.id ? "true" : "false",
        onclick: function () { if (S.sub !== pn.id) { S.sub = pn.id; paint(); } }
      }, [icon(pn.ic), el("span", { text: pn.label })]));
    });
    paint();

    function paint() {
      Array.prototype.forEach.call(nav.children, function (b, i) {
        b.setAttribute("aria-current", PANELS[i].id === S.sub ? "true" : "false");
      });
      host.textContent = "";
      const cur = PANELS.filter(function (x) { return x.id === S.sub; })[0] || PANELS[0];
      host.appendChild(cur.build(M));
    }
  }

  function avgOf(list) {
    const v = list.filter(function (n) { return typeof n === "number"; });
    if (!v.length) return null;
    return Math.round(v.reduce(function (a, b) { return a + b; }, 0) / v.length);
  }

    }));

  function kpi(iconId, wash, tint, value, unit, label, pct, barColor) {
    const c = el("div", { class: "kpi" });
    const ch = el("div", { class: "chip2", style: "background:" + wash + ";color:" + tint });
    ch.appendChild(icon(iconId));
    c.appendChild(ch);
    const v = el("div", { class: "v", text: value });
    if (unit) v.appendChild(el("small", { text: unit }));
    c.appendChild(v);
    c.appendChild(el("div", { class: "k", text: label }));
    const m = el("div", { class: "meter" });
    m.appendChild(el("i", { style: "width:" + Math.round(Math.max(3, Math.min(100, pct))) + "%;background:" + barColor }));
    c.appendChild(m);
    return c;
  }

  /* ---------- panels ---------- */

  function overviewPanel(M) {
    const out = el("div", { class: "stack" });
    const held = M.sessionList.length;
    const attPct = held ? Math.round((M.present / held) * 100) : 0;

    /* --- monthly scoreboard: the three numbers, nothing else --- */
    const sb = el("div", { class: "card" });
    sb.appendChild(el("div", { class: "hd", style: "align-items:center" }, [
      el("h3", { text: "Monthly Scoreboard", style: "font-size:20px" }), monthNav(M.mk)
    ]));
    const k = el("div", { class: "kpis" });
    k.appendChild(kpi("i-cal", "var(--lime-wash)", "var(--tint-lime)",
      held ? attPct + "%" : "—", "", "Attendance", attPct, "var(--c4)"));
    k.appendChild(kpi("i-moon", "var(--blue-wash)", "var(--blue)",
      M.avgBed === null ? "—" : fmtBed(M.avgBed), "", "Avg. bedtime",
      M.avgBed === null ? 0 : Math.max(0, Math.min(100, ((660 - M.avgBed) / 150) * 100)), "var(--blue)"));
    k.appendChild(kpi("i-chart", "var(--amber-wash)", "var(--tint-amber)",
      (M.earnedThisMonth.length ? "+" : "") + M.earnedThisMonth.length, "", "Skills progress",
      Math.min(100, M.earnedThisMonth.length * 25), "var(--amber)"));
    sb.appendChild(k);
    out.appendChild(sb);

    /* --- sleep trend --- */
    if (M.points.length) {
      const c = el("div", { class: "card stack" });
      const hd = el("div", { class: "chart-hd" });
      hd.appendChild(el("h3", { text: "Sleep Trend" }));
      if (M.avgBed !== null && M.prevAvg !== null) {
        const d = M.prevAvg - M.avgBed;
        hd.appendChild(el("div", { style: "text-align:right" }, [
          el("div", {
            class: "delta" + (Math.abs(d) < 6 ? " flat" : d > 0 ? "" : " warn"),
            text: Math.abs(d) < 6 ? "No change" : (d > 0 ? "+" : "−") + Math.abs(d) + " minutes"
          }),
          el("div", { class: "tiny muted", text: (d > 0 ? "Earlier" : d < 0 ? "Later" : "Same") + " than " + M.prevName })
        ]));
      }
      c.appendChild(hd);
      c.appendChild(bedtimeChart(M.points, M.mk));
      c.appendChild(el("p", { class: "tiny muted", style: "margin:0",
        text: "Earlier is higher. The shaded band is 8:30 to 9:30 — the window most 7 to 12 year olds need to get enough sleep before school." }));
      out.appendChild(c);
    }

    /* --- the two things a parent taps into --- */
    if (M.items.length) {
      out.appendChild(linkRow("i-chat", "var(--lime-wash)", "var(--tint-lime)",
        "Coach's Latest Note", M.items[0].t, M.items[0].d,
        function () { S.sub = "notes"; render(); window.scrollTo(0, 0); }));
    }
    if (M.p.goal) {
      out.appendChild(linkRow("i-target", "var(--amber-wash)", "var(--tint-amber)",
        "This Month's Goal", M.p.goal, "",
        function () { S.sub = "skills"; render(); window.scrollTo(0, 0); }));
    }

    if (M.earnedThisMonth.length) {
      const names = M.earnedThisMonth.map(function (id) {
        const s = SKILLS.filter(function (x) { return x.id === id; })[0]; return s ? s.name : id;
      });
      out.appendChild(el("div", { class: "banner good" }, [icon("i-check"), el("div", {}, [
        el("b", { text: names.length === 1 ? "1 step forward this month · " : names.length + " steps forward this month · " }),
        el("span", { text: names.slice(0, 2).join(", ") + (names.length > 2 ? ", and " + (names.length - 2) + " more" : "") })
      ])]));
    }

    if (!held && !M.points.length && !M.items.length) {
      out.appendChild(emptyPanel("i-ball", "Nothing logged for " + MONTHS[Number(M.mk.slice(5)) - 1] + " yet",
        S.role === "coach"
          ? "Mark attendance on the Today tab, then set where they are with a technique under Record."
          : "Save an evening check-in on the Tonight tab and this page fills up."));

    return out;

  function habitsPanel(M) {
    const out = el("div", { class: "stack" });
    const dayList = Object.keys(M.days);
    if (!dayList.length) {
      out.appendChild(emptyPanel("i-moon", "No evening check-ins this month",
        "Once the family saves their first one, bedtime and the four habits build up here."));
      return out;
    }

    out.appendChild(chartCard(
      "Habit grid",
      "One square per day, darker where more of the four habits were done.",
      function () { return habitCalendar(M.days, M.mk); },
      function () {
        const rows = dayList.slice().sort().map(function (k) {
          const r = M.days[k];
          return [Number(k), HABITS.filter(function (h) { return r[h.k]; }).length + " of 4", typeof r.bed === "number" ? fmtBed(r.bed) : "—"];
        });
        return dataTable([{ label: "Day", n: true }, { label: "Habits", n: true }, { label: "Bedtime", n: true }], rows);
      }
    ));

    const totals = HABITS.map(function (h) {
      const n = dayList.filter(function (k) { return M.days[k][h.k]; }).length;
      return { label: h.label, v: n, note: n + " of " + M.inMonth + " days" };
    });
    out.appendChild(chartCard(
      "Which habits are sticking",
      "Days each habit was ticked this month.",
      function () { return hbars(totals, null, M.inMonth); },
      function () { return dataTable([{ label: "Habit" }, { label: "Days", n: true }], totals.map(function (r) { return [r.label, r.note]; })); }
    ));
    return out;
  }

  function skillsPanel(M) { return skillsCard(M.p, M.earned, M.earnedThisMonth); }

      M.items.forEach(function (n) {
        list.appendChild(el("div", { class: "note" }, [el("p", { text: n.t }), el("div", { class: "when", text: n.d })]));

        ]),

      ]));

  function recordPanel(M) { return coachPlayerTools(M.p, M.earned); }

  function emptyPanel(ic, title, body) {
    return el("div", { class: "card empty" }, [icon(ic, "ball"), el("h3", { text: title }), el("p", { text: body })]);
  }

  function daysInMonth(mk) {
    const y = Number(mk.slice(0, 4)), m = Number(mk.slice(5));
    const now = new Date();
    if (y === now.getFullYear() && m === now.getMonth() + 1) return now.getDate();
    return new Date(y, m, 0).getDate();
  }

  function monthSwitcher() {
    const row = el("div", { class: "row", style: "justify-content:space-between" });
    const mk = S.reportMonth;
    const y = Number(mk.slice(0, 4)), m = Number(mk.slice(5));
    const nowK = monthKey(new Date());
    const prev = el("button", { class: "btn ghost", text: "‹ Previous", onclick: function () {
      const d = new Date(y, m - 2, 1); S.reportMonth = monthKey(d); S.cache = {}; render();
    } });
    const next = el("button", { class: "btn ghost", text: "Next ›", onclick: function () {
      const d = new Date(y, m, 1); S.reportMonth = monthKey(d); S.cache = {}; render();
    } });
    next.disabled = mk >= nowK;
    row.appendChild(prev);
    row.appendChild(el("div", { style: "font-family:var(--display);font-weight:700;font-size:18px", text: MON3[m - 1] + " " + y }));
    row.appendChild(next);
    return row;
  }

  function skillsCard(p, earned, thisMonth) {
    const out = el("div", { class: "stack" });
    const total = SKILLS.length;
    const confident = SKILLS.filter(function (s) { return lvlOf(earned, s.id) === 3; }).length;
    const started = SKILLS.filter(function (s) { return lvlOf(earned, s.id) > 0; }).length;

    // the one actionable thing, first — not buried under sixteen badges
    const next = SKILLS.filter(function (s) { return lvlOf(earned, s.id) < 3; })[0];
    if (next) {
      const b = bandOf(next.band);
      out.appendChild(el("div", { class: "card stack" }, [
        el("div", { class: "eyebrow", text: "Working on now" }),
        el("h3", { text: next.name, style: "margin:3px 0 0" }),
        el("div", { class: "tiny muted", text: b.short + " · " + next.strand + " · " + LEVELS[lvlOf(earned, next.id)] }),
        el("div", { class: "note" }, [
          el("p", { class: "small" }, [el("b", { text: "At home: " }), el("span", { text: next.drill })])
        ])
      ]));
    }

    if (thisMonth.length) {
      const names = thisMonth.map(function (id) {
        const s = SKILLS.filter(function (x) { return x.id === id; })[0]; return s ? s.name : id;
      });
      out.appendChild(el("div", { class: "banner good" }, [icon("i-check"), el("div", {}, [
        el("b", { text: names.length === 1 ? "1 step forward this month · " : names.length + " steps forward this month · " }),
        el("span", { text: names.slice(0, 2).join(", ") + (names.length > 2 ? ", and " + (names.length - 2) + " more" : "") })
      ])]));
    }

    const card = el("div", { class: "card stack" });
    card.appendChild(el("div", { class: "hd" }, [
      el("div", { class: "eyebrow", text: "Every technique" }),
      el("div", { class: "small", style: "font-weight:600", text: confident + " confident · " + started + "/" + total + " started" })
    ]));

    const bb = el("div", { class: "bandbar" });
    BANDS.forEach(function (b) {
      const list = skillsOfBand(b.id);
      const score = list.reduce(function (a, s) { return a + lvlOf(earned, s.id); }, 0);
      const seg = el("div", { class: "seg" });
      seg.appendChild(el("i", { style: "width:" + Math.round((score / (list.length * 3)) * 100) + "%;background:" + bandColor(b.id) }));
      bb.appendChild(seg);
    });
    card.appendChild(bb);

    const key = el("div", { class: "lvkey" });
    LEVELS.forEach(function (label, i) {
      key.appendChild(el("span", {}, [crest(cssVar("--c4"), i), el("i", { text: label })]));
    });
    card.appendChild(key);
    card.appendChild(el("p", { class: "tiny muted", style: "margin:0",
      text: "Stages follow Canada Soccer's grassroots age bands. Ongoing observation over a season — nothing here is pass or fail." }));

    BANDS.forEach(function (b) {
      card.appendChild(el("div", { class: "bandhd" }, [
        el("span", { class: "eyebrow", text: b.short }),
        el("span", { class: "tiny muted", text: b.name.split(" · ")[0] + " · " + b.format })
      ]));
      const list = el("div", { class: "sklist" });
      skillsOfBand(b.id).forEach(function (s) {
        const lv = lvlOf(earned, s.id);
        const row = el("div", { class: "skrow" + (lv ? " on" : "") });
        row.appendChild(crest(bandColor(b.id), lv));
        row.appendChild(el("div", { class: "nm", text: s.name }));
        row.appendChild(el("div", { class: "lv", text: LEVELS[lv] }));
        list.appendChild(row);
      });
      card.appendChild(list);
    });

    out.appendChild(card);
    return out;
  }

  /* ---------- coach ---------- */

  function coachPlayerTools(p, earned) {
    const out = el("div", { class: "stack" });
    let card = el("div", { class: "card stack" });

    card.appendChild(el("div", {}, [
      el("div", { class: "eyebrow", text: "Where are they with a technique?" }),
      el("p", { class: "tiny muted", style: "margin:7px 0 0",
        text: "Ongoing observation, not a test. Change it whenever what you see changes." })
    ]));
    const pick = el("div", { class: "field" });
    const sel = el("select", { id: "skillPick", "aria-label": "Technique" });
    sel.appendChild(el("option", { value: "", text: "Choose a technique…" }));
    BANDS.forEach(function (b) {
      skillsOfBand(b.id).forEach(function (s) {
        const lv = lvlOf(earned, s.id);
        sel.appendChild(el("option", { value: s.id, text: b.short + " · " + s.name + (lv ? "  — " + LEVELS[lv] : "") }));
      });
    });
    pick.appendChild(sel);
    card.appendChild(pick);

    const awardMsg = el("div");
    const lvRow = el("div", { class: "chips" });
    function paintLevels() {
      lvRow.textContent = "";
      const id = sel.value;
      if (!id) { lvRow.appendChild(el("span", { class: "tiny muted", text: "Pick a technique to set where they are." })); return; }
      const cur = lvlOf(earned, id);
      LEVELS.forEach(function (label, i) {
        const b = el("button", { type: "button", class: "chip", "aria-pressed": cur === i ? "true" : "false", text: label });
        b.addEventListener("click", async function () { await setLevel(id, i); });
        lvRow.appendChild(b);
      });
    }
    sel.addEventListener("change", paintLevels);

    async function setLevel(id, lv) {
      Array.prototype.forEach.call(lvRow.children, function (c) { c.disabled = true; });
      try {
        await rpc("pr_set_skill", { p_code: S.code, p_player: p.id, p_skill: id, p_level: lv });
        forget();
        awardMsg.textContent = "";
        awardMsg.appendChild(el("div", { class: "saved pop" }, [icon("i-check"), el("span", { text: "Saved — " + LEVELS[lv] + "." })]));
        setTimeout(render, 700);
      } catch (err) {
        Array.prototype.forEach.call(lvRow.children, function (c) { c.disabled = false; });
        awardMsg.textContent = ""; awardMsg.appendChild(el("div", { class: "banner warn" }, [icon("i-info"), el("div", { text: "Could not save that." })]));
      }
    }
    paintLevels();
    card.appendChild(lvRow);
    card.appendChild(awardMsg);
    out.appendChild(card);

    /* --- note for the family --- */
    card = el("div", { class: "card stack" });
    card.appendChild(el("div", {}, [
      el("div", { class: "eyebrow", text: "Note for the family" }),
      el("p", { class: "tiny muted", style: "margin:7px 0 0",
        text: "One thing you noticed this month. This is the first thing families read." })
    ]));
    const nf = el("div", { class: "field" });
    const ta = el("textarea", { id: "noteBox", "aria-label": "Note for the family",
      placeholder: "Much better at listening this month. When he loses the ball he turns and chases it back." });
    nf.appendChild(ta);
    card.appendChild(nf);
    const noteMsg = el("div");
    const addNote = el("button", { class: "btn block", text: "Save note" });
    addNote.addEventListener("click", async function () {
      const t = ta.value.trim(); if (!t) return;
      addNote.disabled = true; addNote.textContent = "Saving…";
      try {
        await rpc("pr_add_note", { p_code: S.code, p_player: p.id, p_body: t });
        forget();
        ta.value = "";
        noteMsg.textContent = "";
        noteMsg.appendChild(el("div", { class: "saved pop" }, [icon("i-check"), el("span", { text: "Note saved." })]));
        setTimeout(render, 700);
      } catch (err) {
        addNote.disabled = false; addNote.textContent = "Save note";
        noteMsg.textContent = ""; noteMsg.appendChild(el("div", { class: "banner warn" }, [icon("i-info"), el("div", { text: "Could not save that." })]));
      }
    });
    card.appendChild(addNote);
    card.appendChild(noteMsg);
    out.appendChild(card);

    /* --- the player's own record: goal, then photo --- */
    card = el("div", { class: "card stack" });
    card.appendChild(el("div", { class: "eyebrow", text: "Player record" }));

    const gf = el("div", { class: "field" });
    gf.appendChild(el("label", { for: "goalBox", text: "Next month's goal" }));
    const gi = el("input", { id: "goalBox", type: "text", value: p.goal || "", placeholder: "Home training, 4 days a week" });
    gf.appendChild(gi);
    card.appendChild(gf);
    const goalBtn = el("button", { class: "btn block", text: "Save goal" });
    goalBtn.addEventListener("click", async function () {
      goalBtn.disabled = true; goalBtn.textContent = "Saving…";
      try {
        await rpc("pr_update_player", { p_code: S.code, p_player: p.id, p_goal: gi.value.trim(), p_photo: null });
        p.goal = gi.value.trim();
        goalBtn.textContent = "Saved";
        setTimeout(function () { goalBtn.disabled = false; goalBtn.textContent = "Save goal"; }, 1200);
      } catch (e) { goalBtn.disabled = false; goalBtn.textContent = "Save goal"; }
    });
    card.appendChild(goalBtn);

    card.appendChild(el("p", { class: "tiny muted", style: "margin:0",
      text: "Player photos are not in this version. Every player shows their initials on the club shirt." }));

    out.appendChild(card);
    return out;
  }

  async function renderTeam() {
    const today = new Date();
    S.flush = [];

    const hero = coverPhoto(el("div", { class: "hero bleed" }), S.settings.cover);
    hero.appendChild(heroTop());
    const th = el("div", { class: "teamhead" });
    th.appendChild(el("div", { class: "grow" }, [
      el("div", { class: "nm" }, [
        el("span", { text: S.settings.academy || "Pitch Ready" }), icon("i-chevdown")
      ]),
      el("div", { class: "sub" }, [
        el("span", { text: DOW[(today.getDay() + 6) % 7] + ", " + MON3[today.getMonth()] + " " + today.getDate() + "  ·  " }),
        el("b", { text: S.players.length + (S.players.length === 1 ? " player" : " players") })
      ])
    ]));
    th.appendChild(el("button", {
      class: "iconbtn", type: "button", "aria-label": "Academy settings",
      onclick: function () { const n = $("#settingsAnchor"); if (n) n.scrollIntoView({ behavior: "smooth", block: "start" }); }
    }, [icon("i-gear")]));
    hero.appendChild(th);

    const tabs = el("div", { class: "pilltabs" });
    [["team", "Today"], ["player", "Players"], ["squad", "Team"], ["notes", "Notes"]].forEach(function (t) {
      tabs.appendChild(el("button", {
        type: "button", text: t[1], "aria-current": t[0] === "team" ? "true" : "false",
        onclick: function () {
          if (t[0] === "notes") { S.tab = "player"; S.sub = "notes"; }
          else S.tab = t[0];
          render(); window.scrollTo(0, 0);
        }
      }));
    });
    hero.appendChild(tabs);
    view.appendChild(hero);

        const canTag = state.att === "P" || state.att === "L";
        obsRow.classList.toggle("off", !canTag);
        effWrap.classList.toggle("off", !canTag);
        if (!canTag) {
          if (state.tags.length) {
            state.tags.length = 0;
            Array.prototype.forEach.call(obsRow.children, function (c) { c.setAttribute("aria-pressed", "false"); });
          }
          if (state.eff) {
            state.eff = 0;
            Array.prototype.forEach.call(pips.children, function (c) { c.setAttribute("aria-pressed", "false"); });
          }
        }

      }, [icon(t.icon)]);

        push();

  const NS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    return n;
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#0E6A47";
  }

  // card that can swap between a chart and its table twin
  function chartCard(title, lede, build, buildTable) {
    const card = el("div", { class: "card stack" });
    const hd = el("div", { class: "chart-hd" });
    const left = el("div", {}, [el("h3", { text: title }), lede ? el("div", { class: "lede", text: lede }) : null]);
    const toggle = el("button", { class: "tbtn", type: "button", "aria-pressed": "false", text: "Table" });
    hd.appendChild(left);
    hd.appendChild(toggle);
    card.appendChild(hd);
    const slot = el("div");
    card.appendChild(slot);
    let showing = "chart";
    function paint() {
      slot.textContent = "";
      slot.appendChild(showing === "chart" ? build() : buildTable());
      toggle.setAttribute("aria-pressed", showing === "table" ? "true" : "false");
      toggle.textContent = showing === "table" ? "Chart" : "Table";
    }
    toggle.addEventListener("click", function () { showing = showing === "chart" ? "table" : "chart"; paint(); });
    paint();
    return card;
  }

  // one series over the days of a month; earlier bedtime sits higher
  function bedtimeChart(points, mk) {
    const host = el("div", { class: "chart" });
    if (!points.length) return el("p", { class: "small muted", style: "margin:0", text: "No bedtimes logged this month yet." });
    const W = 360, H = 190, L = 42, R = 14, T = 14, B = 26;
    const last = daysInMonth(mk);
    const lo = 480, hi = 690; // 8:00 pm to 11:30 pm
    const x = function (d) { return L + ((d - 1) / Math.max(1, last - 1)) * (W - L - R); };
    const y = function (m) { return T + ((Math.min(hi, Math.max(lo, m)) - lo) / (hi - lo)) * (H - T - B); };
    const s = sv("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Bedtime for each logged day this month" });

    // the target band, as a wash
    s.appendChild(sv("rect", { x: L, y: y(510), width: W - L - R, height: y(570) - y(510), fill: cssVar("--c5"), "fill-opacity": ".10" }));
    s.appendChild(sv("text", { x: L + 5, y: y(540) + 4, class: "axis", "font-size": "10.5" })).textContent = "target";

    [510, 570, 630].forEach(function (m) {
      s.appendChild(sv("line", { x1: L, x2: W - R, y1: y(m), y2: y(m), stroke: cssVar("--grid"), "stroke-width": "1" }));
      const t = sv("text", { x: L - 7, y: y(m) + 4, class: "axis", "text-anchor": "end" });
      t.textContent = fmtBed(m);
      s.appendChild(t);
    });
    const marks = [1, Math.round(last / 2), last];
    marks.forEach(function (d) {
      const t = sv("text", { x: x(d), y: H - 8, class: "axis", "text-anchor": d === 1 ? "start" : d === last ? "end" : "middle" });
      t.textContent = String(d);
      s.appendChild(t);
    });

    const d = points.map(function (p, i) { return (i ? "L" : "M") + x(p.day) + " " + y(p.bed); }).join(" ");
    s.appendChild(sv("path", { d: d, fill: "none", stroke: cssVar("--c5"), "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round" }));
    points.forEach(function (p) {
      s.appendChild(sv("circle", { cx: x(p.day), cy: y(p.bed), r: "4", fill: cssVar("--c5"), stroke: cssVar("--card"), "stroke-width": "2" }));
    });
    const endp = points[points.length - 1];
    const lab = sv("text", { x: x(endp.day), y: y(endp.bed) - 11, class: "vlabel", "text-anchor": endp.day > last * 0.75 ? "end" : "middle" });
    lab.textContent = fmtBed(endp.bed);
    s.appendChild(lab);

    const cross = sv("line", { y1: T, y2: H - B, stroke: cssVar("--muted"), "stroke-width": "1", opacity: "0" });
    s.appendChild(cross);
    const hit = sv("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
    s.appendChild(hit);
    host.appendChild(s);
    const tip = el("div", { class: "tip" });
    host.appendChild(tip);

    function move(ev) {
      const box = s.getBoundingClientRect();
      const px = ((ev.clientX - box.left) / box.width) * W;
      let best = points[0], bd = Infinity;
      points.forEach(function (p) { const dd = Math.abs(x(p.day) - px); if (dd < bd) { bd = dd; best = p; } });
      cross.setAttribute("x1", x(best.day)); cross.setAttribute("x2", x(best.day)); cross.setAttribute("opacity", ".35");
      tip.textContent = "";
      tip.appendChild(el("b", { text: fmtBed(best.bed) }));
      tip.appendChild(el("span", { text: MON3[Number(mk.slice(5)) - 1] + " " + best.day }));
      tip.style.opacity = "1";
      const rel = (x(best.day) / W) * box.width;
      tip.style.left = Math.max(0, Math.min(box.width - 110, rel - 55)) + "px";
      tip.style.top = "0px";
    }
    s.addEventListener("pointermove", move);
    s.addEventListener("pointerleave", function () { tip.style.opacity = "0"; cross.setAttribute("opacity", "0"); });
    return host;
  }

  // horizontal bars, one colour, value outside the tip
  // scale: pass the real denominator (days in the month, sessions held) so four
  // equal values do not all draw as a full bar
  function hbars(rows, unit, scale) {
    const max = Math.max(1, scale || 0, ...rows.map(function (r) { return r.v; }));
    const wrap = el("div", { class: "bars" });
    rows.forEach(function (r) {
      const row = el("div", { class: "bar" });
      row.appendChild(el("div", { class: "nm", text: r.label }));
      row.appendChild(el("div", { class: "vl", text: r.note || (r.v + (unit ? " " + unit : "")) }));
      const tr = el("div", { class: "track" });
      tr.appendChild(el("i", { style: "width:" + Math.round((r.v / max) * 100) + "%" }));
      row.appendChild(tr);
      wrap.appendChild(row);
    });
    return wrap;
  }

  // month grid: each day shaded by how many of the four habits were done
  function habitCalendar(days, mk) {
    const wrap = el("div", { class: "stack", style: "gap:9px" });
    const grid = el("div", { class: "cal" });
    ["M", "T", "W", "T", "F", "S", "S"].forEach(function (d) { grid.appendChild(el("div", { class: "hd", text: d })); });
    const y = Number(mk.slice(0, 4)), m = Number(mk.slice(5));
    const first = new Date(y, m - 1, 1);
    const lead = (first.getDay() + 6) % 7;
    const last = new Date(y, m, 0).getDate();
    const todayK = ymd(new Date());
    for (let i = 0; i < lead; i++) grid.appendChild(el("button", { class: "out", type: "button", disabled: true, "aria-hidden": "true" }));
    for (let d = 1; d <= last; d++) {
      const rec = days[pad(d)] || null;
      const n = rec ? HABITS.filter(function (h) { return rec[h.k]; }).length : 0;
      const b = el("button", {
        type: "button", class: "lv" + n, text: String(d),
        style: "background:var(--c" + (n + 1) + ")",
        "aria-label": d + ": " + (rec ? n + " of 4 habits" : "no check-in")
      });
      if (ymd(new Date(y, m - 1, d)) === todayK) b.classList.add("today");
      grid.appendChild(b);
    }
    wrap.appendChild(grid);
    const lg = el("div", { class: "legend" });
    lg.appendChild(el("span", { text: "Habits done" }));
    const ramp = el("div", { class: "ramp" });
    [0, 1, 2, 3, 4].forEach(function (n) { ramp.appendChild(el("i", { style: "background:var(--c" + (n + 1) + ")" })); });
    lg.appendChild(ramp);
    lg.appendChild(el("span", { text: "none to all four" }));
    wrap.appendChild(lg);
    return wrap;
  }

  async function renderSquad() {
    const mk = S.reportMonth;
    const head = el("div", { class: "slab" });
    head.appendChild(el("div", { class: "ttl", text: "Squad analysis" }));
    head.appendChild(el("div", { class: "sub", text: MONTHS[Number(mk.slice(5)) - 1] + " " + mk.slice(0, 4) }));
    view.appendChild(head);
    const host = el("div", { class: "stack" });
    view.appendChild(host);
    host.appendChild(el("div", { class: "card muted small", text: "Reading the month…" }));

    const month = await loadMonth(S.players, mk);
    const inMonth = daysInMonth(mk);
    host.textContent = "";
    host.appendChild(monthSwitcher());

    if (S.role === "coach") {
      let sessTotal = 0, sessPresent = 0, checkDays = 0;
      const att = [], part = [];
      S.players.forEach(function (p) {
        const m = month[p.id];
        const sKeys = Object.keys(m.sess);
        const present = sKeys.filter(function (k) { return m.sess[k].att === "P" || m.sess[k].att === "L"; }).length;
        sessTotal += sKeys.length; sessPresent += present;
        const cKeys = Object.keys(m.checks);
        checkDays += cKeys.length;
        att.push({ label: p.name || "Player", v: present, held: sKeys.length, note: sKeys.length ? present + " of " + sKeys.length : "no sessions" });
        part.push({ label: p.name || "Player", v: cKeys.length, note: cKeys.length + " of " + inMonth + " days" });
      });
      att.sort(function (a, b) { return b.v - a.v; });
      part.sort(function (a, b) { return b.v - a.v; });

      const g = el("div", { class: "slabgrid" });
      [[S.players.length, "Players"],
       [sessTotal ? Math.round((sessPresent / sessTotal) * 100) + "%" : "—", "Turned up"],
       [sessTotal, "Session records"],
       [S.players.length ? Math.round((checkDays / (S.players.length * inMonth)) * 100) + "%" : "—", "Evenings logged"]
      ].forEach(function (pair) {
        g.appendChild(el("div", {}, [el("div", { class: "v", text: String(pair[0]) }), el("div", { class: "k", text: pair[1] })]));
      });
      head.appendChild(g);

      host.appendChild(chartCard(
        "Attendance this month",
        "How many sessions each player turned up to. Operational only — it says nothing about how well anyone played.",
        function () { return hbars(att, null, att.reduce(function (a, r) { return Math.max(a, r.held || 0); }, 0)); },
        function () { return dataTable([{ label: "Player" }, { label: "Attended", n: true }], att.map(function (r) { return [r.label, r.note]; })); }
      ));

      host.appendChild(chartCard(
        "Evenings logged by each family",
        "Which families are filling in the nightly check-in. A low bar means the habit data is thin, not that the child is doing badly.",
        function () { return hbars(part, null, inMonth); },
        function () { return dataTable([{ label: "Player" }, { label: "Days", n: true }], part.map(function (r) { return [r.label, r.note]; })); }
      ));

      host.appendChild(el("div", { class: "card stack" }, [
        el("div", { class: "eyebrow", text: "One player at a time" }),
        el("p", { class: "small muted", style: "margin:0", text: "Open a player to see their bedtime trend, habit grid and skills." }),
        playerButtons()
      ]));
    }
  }

  function playerButtons() {
    const row = el("div", { class: "chips" });
    S.players.forEach(function (p) {
      const b = el("button", {
        type: "button", class: "chip", text: p.name || "Player",
        onclick: function () { S.myPlayer = p.id; S.tab = "player"; render(); }
      });
      row.appendChild(b);
    });
    return row;
  }

  /* ================= wiring ================= */

  Array.prototype.forEach.call(tabsEl.querySelectorAll("[data-tab]"), function (b) {
    b.addEventListener("click", function () { S.tab = b.dataset.tab; S.cache = {}; render(); });
  });
  function setRole(r) {
    S.role = r; S.tab = r === "coach" ? "team" : "tonight";
    lsSet("pr.role", r); render(); window.scrollTo(0, 0);
  }

  (async function boot() {
    applyKit("pitch");
    const saved = lsGet("pr.code");
    if (saved) {
      try { await joinAcademy(saved); }
      catch (e) {
        // a code that no longer works should not strand the app on a blank screen
        if ((e && e.message) === "unknown_code") { S.code = ""; lsSet("pr.code", ""); }
        else S.bootError = friendly(e);
      }
    }
    S.tab = S.role === "coach" ? "team" : "tonight";
    S.ready = true;
    render();
  })();
})();
</script>
