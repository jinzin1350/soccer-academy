plugins { id "com.android.application" }

android {
    namespace "ca.alirezaai.pitchready"
    compileSdk 34

    defaultConfig {
        applicationId "ca.alirezaai.pitchready"
        minSdk 26                 // Android 8.0 — adaptive icons, modern WebView
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug-signed so the APK installs by sideload without a keystore
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pins one Kotlin stdlib across the graph. Without it appcompat and its
    // transitives drag in both kotlin-stdlib 1.8.x and the old jdk7/jdk8
    // split artifacts, whose classes now overlap, and dexing fails on
    // duplicate classes.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")

    // Only AppCompatActivity and the back-press dispatcher are used; the
    // WebView itself is the framework one, so androidx.webkit is not needed.
    implementation "androidx.appcompat:appcompat:1.7.0"
}
