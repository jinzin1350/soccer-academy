plugins { id "com.android.application" }

android {
    namespace "ca.alirezaai.pitchready"
    compileSdk 34

    defaultConfig {
        applicationId "ca.alirezaai.pitchready"
        minSdk 26                 // Android 8.0 — adaptive icons, modern WebView
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug-signed so the APK installs by sideload without a keystore
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
}
